<div class="min-h-dvh flex flex-col bg-base-100 text-base-content">
  <header class="sticky top-0 z-30 bg-base-200/95 backdrop-blur border-b border-base-300 pt-[env(safe-area-inset-top)]">
    <div class="w-full max-w-7xl mx-auto px-4 h-16 flex items-center gap-3">
      <a routerLink="/plataforma" class="shrink-0" aria-label="Ir a la plataforma">
        <img src="logos/logo-oficial-sin-fondo-lb.png" alt="RutaRola" class="h-9 w-auto" />
      </a>
      <div class="min-w-0 flex-1 border-l border-base-300 pl-3 flex items-center gap-2.5">
        <app-avatar class="max-[359px]:hidden" [foto]="sesion()?.imagen" [iniciales]="inicialesDe(sesion()?.nombre ?? '')" tono="suave" />
        <div class="min-w-0">
          <p class="font-semibold leading-tight truncate">{{ sesion()?.nombre }}</p>
          <p class="text-xs text-base-content/70 flex items-center gap-1.5">
            <i class="fa-solid fa-shield-halved text-info" aria-hidden="true"></i> Plataforma RutaRola
          </p>
        </div>
      </div>
      <nav class="flex items-center gap-1" aria-label="Secciones de la plataforma">
        <a routerLink="/plataforma/empresas" routerLinkActive="bg-base-300" class="btn btn-ghost btn-sm">
          <i class="fa-solid fa-building" aria-hidden="true"></i><span class="hidden sm:inline">Empresas</span>
        </a>
        <a routerLink="/plataforma/codigos-promocionales" routerLinkActive="bg-base-300" class="btn btn-ghost btn-sm" aria-label="Códigos promocionales">
          <i class="fa-solid fa-ticket" aria-hidden="true"></i><span class="hidden sm:inline">Promociones</span>
        </a>
        <a routerLink="/plataforma/soporte" routerLinkActive="bg-base-300" class="btn btn-ghost btn-sm">
          <i class="fa-solid fa-headset" aria-hidden="true"></i><span class="hidden sm:inline">Soporte</span>
        </a>
        <a routerLink="/plataforma/ajustes" routerLinkActive="bg-base-300" class="btn btn-ghost btn-sm" aria-label="Ajustes de la plataforma">
          <i class="fa-solid fa-sliders" aria-hidden="true"></i><span class="hidden sm:inline">Ajustes</span>
        </a>
        <a routerLink="/plataforma/cuenta" routerLinkActive="bg-base-300" class="btn btn-ghost btn-sm btn-square" aria-label="Mi cuenta">
          <i class="fa-solid fa-user-gear" aria-hidden="true"></i>
        </a>
      </nav>
      <button type="button" class="btn btn-ghost btn-sm text-error" (click)="salir()" aria-label="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        <span class="hidden sm:inline">Salir</span>
      </button>
    </div>
  </header>
  <app-notificaciones />

  <main class="flex-1 w-full max-w-7xl mx-auto min-w-0 px-3 sm:px-4 py-4 sm:py-6 pb-[max(1.5rem,env(safe-area-inset-bottom))]">
    <router-outlet />
  </main>
</div>
