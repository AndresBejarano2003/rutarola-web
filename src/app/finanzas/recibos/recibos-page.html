<app-recibos-filtros (cambiar)="store.buscar($event)" />

<section class="mt-6 card bg-base-200 border border-base-300 shadow-xl">
  <div class="card-body">
    <app-encabezado-listado titulo="Recibos de pago" descripcion="Pagos de las mensualidades de cada factura."
      [cargando]="store.cargando()" [total]="store.total()" [modoLocal]="store.modoLocal" [error]="store.error()"
      textoNuevo="Registrar pago" (nuevo)="nuevo()" (reintentar)="store.recargar()" />

    <app-recibos-tabla [recibos]="store.items()" [cargando]="store.cargando()" [hayFiltros]="store.hayFiltros()"
      (consultar)="abrir('consultar', $event)" (editar)="abrir('editar', $event)" (eliminar)="pedirEliminar($event)" (crear)="nuevo()" (pdf)="descargarPdf($event)" />

    <app-paginacion [pagina]="store.paginacion().pagina" [tamano]="store.paginacion().tamano" [total]="store.total()"
      [totalPaginas]="store.totalPaginas()" (cambiarPagina)="store.irAPagina($event)" (cambiarTamano)="store.cambiarTamano($event)" />
  </div>
</section>

<app-modal [(abierto)]="modalAbierto" [titulo]="tituloModal()" [subtitulo]="subtituloModal()" ancho="max-w-4xl">
  @if (modalAbierto()) {
    <div class="relative">
      @if (cargandoDetalle()) {
        <div class="absolute inset-0 z-10 grid place-items-center bg-base-200/80 rounded-xl">
          <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
      }
      <app-recibo-formulario idFormulario="form-recibo" [modo]="modo()" [recibo]="seleccionado()"
        [facturas]="facturas()" [factura]="detalleFactura().factura" [periodosPagados]="detalleFactura().pagados"
        (facturaCambiada)="facturaFormulario.set($event)" (guardar)="guardar($event)" />
    </div>
  }
  @if (modalAbierto()) {
    <app-acciones-formulario pie formulario="form-recibo" [modo]="modo()" [guardando]="store.guardando()"
      [bloqueado]="cargandoDetalle()" textoCrear="Registrar pago" (cancelar)="modalAbierto.set(false)" (editar)="modo.set('editar')">
      @if (modo() === 'consultar' && seleccionado(); as registro) {
        <button type="button" class="btn bg-base-300 border-neutral hover:bg-neutral" (click)="descargarPdf(registro)">
          <i class="fa-solid fa-file-pdf text-info" aria-hidden="true"></i> Descargar PDF
        </button>
      }
    </app-acciones-formulario>
  }
</app-modal>

<app-dialogo-confirmacion [(abierto)]="confirmacionAbierta" titulo="Eliminar recibo" [mensaje]="mensajeEliminar()"
  [permitirConfirmar]="puedeEliminar()" [procesando]="store.guardando() || verificandoEliminar()" (confirmar)="confirmarEliminar()" />
