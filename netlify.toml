# LEGADO: RutaRola ya no se publica en Netlify (producción = servidor propio, https://app.rutarola.com, con Coolify).
# Este sitio solo redirige todo al dominio nuevo para que nadie use la copia vieja. Las pantallas usan rutas con hash
# (#/...): el navegador conserva el "#/..." al seguir la redirección, así que un enlace viejo abre la misma pantalla.
# Cuando ya nadie entre por rutarola.netlify.app, se puede borrar el sitio en el panel de Netlify y este archivo.
[build]
  command = "mkdir -p redireccion && echo 'Redirigiendo a https://app.rutarola.com' > redireccion/index.html"
  publish = "redireccion"

[[redirects]]
  from = "/*"
  to = "https://app.rutarola.com/"
  status = 301
  force = true
