server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # www.rutarola.com → rutarola.com (una sola dirección para Google)
  if ($host = www.rutarola.com) { return 301 https://rutarola.com$request_uri; }

  # Imágenes: un mes en caché. HTML, CSS y JS se revalidan para que los cambios se vean al publicar.
  location /img/ { expires 30d; }
  location ~* \.(css|js)$ { expires -1; }

  # Atajos útiles para compartir.
  location = /ingresar { return 302 https://app.rutarola.com/; }
  location = /registro { return 302 https://app.rutarola.com/#/registro; }
  location = /app { return 302 /descargar; }

  # Páginas legales con dirección limpia: /privacidad, /terminos, /eliminar-cuenta (archivos .html).
  location / { try_files $uri $uri.html $uri/ /index.html; expires -1; }
}
